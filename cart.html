<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cart - DIANA CREATIONS</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar"><div class="nav-container"><h2 class="logo">DIANA CREATIONS</h2><ul class="nav-menu"><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li></ul></div></nav>
<section style="padding:50px 5%"><h1>Your Cart</h1><div id="cart-items"></div><h3 id="cart-total"></h3><a href="checkout.html" class="btn btn-gold">Proceed to Checkout</a></section>
<script src="script.js"></script><script>
let cart=JSON.parse(localStorage.getItem('cart'))||[];let total=0;
cart.forEach(i=>{total+=i.price;document.getElementById('cart-items').innerHTML+=`<p>${i.name} - ₦${i.price.toLocaleString()}</p>`});
document.getElementById('cart-total').innerText=`Subtotal: ₦${total.toLocaleString()}`;
</script></body></html>
